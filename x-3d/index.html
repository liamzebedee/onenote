<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebooks</title>
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
#status {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 24px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  color: #fff;
  font: 500 15px/1.4 system-ui, sans-serif;
  border-radius: 10px;
  pointer-events: none;
  transition: opacity 0.25s;
}
</style>
</head>
<body>
<div id="status">Hover over a notebook</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Config ─────────────────────────────────────── */
const NOTEBOOKS = [
  { title: 'Work Notes',     color: '#9B6BB0' },
  { title: 'Project Ideas',  color: '#7B9ED4' },
  { title: 'Travel Journal', color: '#8BB877' },
];
const STACK_GAP = 0.15;

/* ── Renderer ───────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

/* ── Scene ──────────────────────────────────────── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a2518);

/* ── Camera ─────────────────────────────────────── */
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
camera.position.set(14, 12, 16);

/* ── Controls ───────────────────────────────────── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 2, 0);
controls.update();

/* ── Lights ─────────────────────────────────────── */
scene.add(new THREE.AmbientLight(0xffe8d0, 0.6));
const key = new THREE.DirectionalLight(0xfff4e8, 1.8);
key.position.set(4, 12, 8);
scene.add(key);
const fill = new THREE.DirectionalLight(0xd0d8ff, 0.3);
fill.position.set(-6, 4, -4);
scene.add(fill);

/* ── Desk ───────────────────────────────────────── */
scene.add((() => {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ color: 0x5a3825, roughness: 0.9 })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.y = -0.1;
  return m;
})());

/* ── Texture tinting + baked spine text ─────────── */
function tintAlbedo(img, css, title) {
  const cv = document.createElement('canvas');
  cv.width = img.width;
  cv.height = img.height;
  const cx = cv.getContext('2d');

  // Draw original albedo
  cx.drawImage(img, 0, 0);

  // Apply color tint (replaces hue/saturation, keeps luminance)
  cx.globalCompositeOperation = 'color';
  cx.fillStyle = css;
  cx.fillRect(0, 0, cv.width, cv.height);

  // Bake title text onto the spine leather strip
  // Spine UV: u=[0.852, 0.952], v=[0.01, 0.465]
  // Canvas: x = u * w,  y = (1 - v) * h
  // V axis = notebook width direction; text rotated 90deg CW to run along it
  const w = cv.width, h = cv.height;
  const spCx = 0.900 * w;               // spine center U
  const spCy = (1 - 0.24) * h;          // spine center V
  const fontSize = Math.round(w * 0.032); // larger for readability on spine

  cx.save();
  cx.translate(spCx, spCy);
  cx.rotate(Math.PI / 2);

  cx.font = `bold ${fontSize}px Georgia, "Palatino Linotype", serif`;
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';

  // Pass 1: dark deboss (multiply darkens the leather underneath)
  cx.globalCompositeOperation = 'multiply';
  cx.fillStyle = 'rgba(40, 25, 10, 0.85)';
  cx.fillText(title, 0, 2);

  // Pass 2: gold foil stamp (screen brightens to create metallic look)
  cx.globalCompositeOperation = 'screen';
  cx.fillStyle = 'rgba(225, 210, 160, 0.8)';
  cx.fillText(title, 0, 0);

  // Pass 3: reinforce with soft-light for texture blending
  cx.globalCompositeOperation = 'soft-light';
  cx.fillStyle = 'rgba(255, 240, 200, 0.6)';
  cx.fillText(title, 0, -1);

  cx.restore();

  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ── State ──────────────────────────────────────── */
const pointer = new THREE.Vector2(Infinity, Infinity);
const raycaster = new THREE.Raycaster();
const groups = [];
let hovered = null;
const statusEl = document.getElementById('status');

/* ── Build ──────────────────────────────────────── */
const albedoImg = new Image();
albedoImg.src = 'model/albedo.jpg';
albedoImg.onload = buildScene;

function buildScene() {
  const tl = new THREE.TextureLoader();
  const roughTex = tl.load('model/roughness.jpg');
  const normTex = tl.load('model/normal.png');

  new OBJLoader().load('model/notebook.obj', base => {
    const bb = new THREE.Box3().setFromObject(base);
    const sz = bb.getSize(new THREE.Vector3());
    const ct = bb.getCenter(new THREE.Vector3());

    // Normalize so longest side ~ 10 units
    const s = 10 / Math.max(sz.x, sz.y, sz.z);

    NOTEBOOKS.forEach((nb, i) => {
      const group = new THREE.Group();
      group.userData = { ...nb, meshes: [] };

      const obj = base.clone();
      const map = tintAlbedo(albedoImg, nb.color, nb.title);

      obj.traverse(ch => {
        if (!ch.isMesh) return;
        ch.material = new THREE.MeshStandardMaterial({
          map,
          roughnessMap: roughTex,
          normalMap: normTex,
          roughness: 0.85,
          metalness: 0.0,
        });
        group.userData.meshes.push(ch);
      });

      // Center and scale via a pivot
      const pivot = new THREE.Group();
      obj.position.set(-ct.x, -ct.y, -ct.z);
      pivot.add(obj);
      pivot.scale.setScalar(s);
      group.add(pivot);

      // Lay flat — rotate so cover faces up
      group.rotation.x = -Math.PI / 2;

      // Stack upward (Y)
      const thick = sz.z * s;
      group.position.y = i * (thick + STACK_GAP);

      // Slight random twist
      group.rotation.z = (Math.random() - 0.5) * 0.025;

      scene.add(group);
      groups.push(group);
    });

    // Frame camera: angled to show spines like reference image
    const H = groups.length * (sz.z * s + STACK_GAP);
    controls.target.set(0, H * 0.4, 0);
    camera.position.set(8, H + 1, 16);
    controls.update();
  });
}

/* ── Pointer events ─────────────────────────────── */
addEventListener('pointermove', e => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
});

addEventListener('click', () => {
  if (hovered) {
    statusEl.textContent = `Selected: ${hovered.userData.title}`;
  }
});

/* ── Render loop ────────────────────────────────── */
(function loop() {
  requestAnimationFrame(loop);
  controls.update();

  // Raycast for hover
  raycaster.setFromCamera(pointer, camera);
  let hit = null;
  for (const g of groups) {
    if (raycaster.intersectObject(g, true).length) { hit = g; break; }
  }

  if (hit !== hovered) {
    if (hovered) {
      for (const m of hovered.userData.meshes) {
        m.material.opacity = 1;
        m.material.transparent = false;
        m.material.needsUpdate = true;
      }
    }
    hovered = hit;
    if (hovered) {
      for (const m of hovered.userData.meshes) {
        m.material.transparent = true;
        m.material.opacity = 0.75;
        m.material.needsUpdate = true;
      }
      renderer.domElement.style.cursor = 'pointer';
      statusEl.textContent = hovered.userData.title;
    } else {
      renderer.domElement.style.cursor = 'grab';
      statusEl.textContent = 'Hover over a notebook';
    }
  }

  renderer.render(scene, camera);
})();

/* ── Resize ─────────────────────────────────────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
