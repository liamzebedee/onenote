<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Brown leather background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6b3a1f"/>
      <stop offset="40%" stop-color="#5a2d14"/>
      <stop offset="100%" stop-color="#3d1e0c"/>
    </linearGradient>
    <!-- Inner vignette -->
    <radialGradient id="bgVignette" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </radialGradient>
    <!-- Gold gradient for text -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d080"/>
      <stop offset="25%" stop-color="#dab44a"/>
      <stop offset="50%" stop-color="#c89e38"/>
      <stop offset="75%" stop-color="#dab44a"/>
      <stop offset="100%" stop-color="#f0d080"/>
    </linearGradient>
    <!-- Gold for border -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c868"/>
      <stop offset="50%" stop-color="#b8892e"/>
      <stop offset="100%" stop-color="#d4a44a"/>
    </linearGradient>
    <!-- Emboss filter for gold text -->
    <filter id="emboss" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <!-- Leather grain texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="5" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="grained"/>
      <feComposite in="grained" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Full-bleed leather background (system applies squircle mask) -->
  <rect width="1024" height="1024" fill="url(#bg)" filter="url(#grain)"/>
  <rect width="1024" height="1024" fill="url(#bgVignette)"/>

  <!-- Gold decorative double border -->
  <rect x="80" y="80" width="864" height="864" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
  <rect x="96" y="96" width="832" height="832" rx="8" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" opacity="0.5"/>

  <!-- Gold corner ornaments -->
  <g stroke="url(#goldBorder)" stroke-width="2.5" fill="none" opacity="0.7">
    <!-- Top-left -->
    <path d="M98,108 L98,96 Q98,88 106,88 L118,88"/>
    <path d="M104,104 L104,98 Q104,94 108,94 L114,94" stroke-width="1.5"/>
    <!-- Top-right -->
    <path d="M926,108 L926,96 Q926,88 918,88 L906,88"/>
    <path d="M920,104 L920,98 Q920,94 916,94 L910,94" stroke-width="1.5"/>
    <!-- Bottom-left -->
    <path d="M98,916 L98,928 Q98,936 106,936 L118,936"/>
    <path d="M104,920 L104,926 Q104,930 108,930 L114,930" stroke-width="1.5"/>
    <!-- Bottom-right -->
    <path d="M926,916 L926,928 Q926,936 918,936 L906,936"/>
    <path d="M920,920 L920,926 Q920,930 916,930 L910,930" stroke-width="1.5"/>
  </g>

  <!-- "NB" monogram — shadow layer -->
  <text x="512" y="548" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="310" font-weight="bold" fill="rgba(0,0,0,0.4)" letter-spacing="-16"
        transform="translate(2.5,4)">NB</text>
  <!-- "NB" monogram — main gold -->
  <text x="512" y="548" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="310" font-weight="bold" fill="url(#gold)" letter-spacing="-16"
        filter="url(#emboss)">NB</text>
  <!-- "NB" monogram — highlight -->
  <text x="512" y="548" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="310" font-weight="bold" fill="rgba(255,240,200,0.15)" letter-spacing="-16"
        transform="translate(-1,-1.5)">NB</text>

  <!-- "NOTEBOUND" label -->
  <text x="512" y="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="42" fill="url(#goldBorder)" letter-spacing="12" opacity="0.7">NOTEBOUND</text>

  <!-- Subtle top highlight -->
  <rect width="1024" height="400" fill="url(#bgVignette)" opacity="0.04"/>
</svg>
